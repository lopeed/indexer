name: Cukies Metadata Indexer
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'   # 4:00 UTC (5:00/6:00 en España)
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Run Cukies indexer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BSCTRACE_API_KEY: ${{ secrets.BSCTRACE_API_KEY }}
        run: node indexer_cukies.cjs